# Local Postgres for development. From the repo root: `npm run db:up` / `npm run db:down`.
# DATABASE_URL=postgresql://payload:payload@127.0.0.1:5442/payload
name: astro-payload-app

services:
  postgres:
    image: postgres:16
    container_name: astro-payload-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    ports:
      - '5442:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
    name: astro-payload-pgdata
