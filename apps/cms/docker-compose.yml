# Optional local Postgres, for working without the hosted (Neon) database.
# Point DATABASE_URL at postgresql://payload:payload@127.0.0.1:5442/payload
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    ports:
      - '5442:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
